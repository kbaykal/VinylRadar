<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Vinyl Radar</title>
<meta name="description" content="Track your vinyl collection. Scan barcodes, get tracklists, see what your records are worth.">
<meta name="theme-color" content="#1a1a18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf9f6;--bg2:#f0eeea;--bg3:#e6e3dd;
  --tx:#1a1a18;--tx2:#5c5a54;--tx3:#8a877f;
  --accent:#c84b31;--accent2:#e86f55;--accent-bg:rgba(200,75,49,0.08);
  --border:#ddd9d0;--border2:#c9c4b8;
  --card:#fff;--radius:10px;--radius-lg:14px;
  --serif:'DM Serif Display',Georgia,serif;
  --sans:'Syne',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'SF Mono','Fira Code',monospace;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a1a18;--bg2:#242420;--bg3:#2e2e28;
    --tx:#ece8df;--tx2:#a09d94;--tx3:#6d6a62;
    --accent:#e86f55;--accent2:#ff9b85;--accent-bg:rgba(232,111,85,0.12);
    --border:#3a3830;--border2:#4a4840;
    --card:#242420;
  }
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);background:var(--bg);color:var(--tx);
  min-height:100vh;min-height:100dvh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
input,select,textarea,button{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--accent);text-decoration:none}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes scanLine{0%{top:10%}50%{top:85%}100%{top:10%}}
.anim-fade{animation:fadeUp .4s ease-out both}
.anim-stagger>*{animation:fadeUp .4s ease-out both}
.anim-stagger>*:nth-child(1){animation-delay:.05s}
.anim-stagger>*:nth-child(2){animation-delay:.1s}
.anim-stagger>*:nth-child(3){animation-delay:.15s}
.anim-stagger>*:nth-child(4){animation-delay:.2s}
.anim-stagger>*:nth-child(5){animation-delay:.25s}
.anim-stagger>*:nth-child(6){animation-delay:.3s}

/* Layout */
.app{max-width:960px;margin:0 auto;padding-bottom:100px}

/* Header */
.header{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.header-inner{
  max-width:960px;margin:0 auto;padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;
}
.logo{display:flex;align-items:center;gap:12px}
.logo svg{width:36px;height:36px;animation:spinSlow 10s linear infinite}
.logo-text h1{font-family:var(--serif);font-size:26px;line-height:1;letter-spacing:-.5px}
.logo-text p{font-size:9px;text-transform:uppercase;letter-spacing:.25em;color:var(--tx3);margin-top:2px}
.btn-add{
  background:var(--accent);color:#fff;
  padding:10px 20px;border-radius:50px;
  font-weight:600;font-size:14px;letter-spacing:.02em;
  display:flex;align-items:center;gap:8px;
  transition:all .2s;box-shadow:0 2px 12px rgba(200,75,49,.25);
}
.btn-add:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 4px 20px rgba(200,75,49,.35)}

/* Tabs */
.tabs{
  display:flex;gap:2px;padding:0 20px;
  max-width:960px;margin:0 auto;
  border-bottom:1px solid var(--border);
}
.tab{
  position:relative;padding:14px 18px;font-size:13px;font-weight:500;
  color:var(--tx3);display:flex;align-items:center;gap:7px;
  transition:color .2s;letter-spacing:.01em;
}
.tab:hover{color:var(--tx2)}
.tab.active{color:var(--tx)}
.tab.active::after{
  content:'';position:absolute;bottom:-1px;left:0;right:0;
  height:2px;background:var(--accent);border-radius:2px 2px 0 0;
}
.tab svg{width:15px;height:15px}

/* Content */
.content{padding:24px 20px}

/* Search bar */
.search-bar{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.search-input{
  flex:1;min-width:200px;position:relative;
}
.search-input input{
  width:100%;padding:10px 12px 10px 38px;
  background:var(--card);border:1px solid var(--border);
  border-radius:50px;font-size:14px;color:var(--tx);
  transition:border-color .2s;
}
.search-input input:focus{outline:none;border-color:var(--accent)}
.search-input input::placeholder{color:var(--tx3)}
.search-input svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--tx3)}
.sort-select{
  padding:10px 16px;background:var(--card);border:1px solid var(--border);
  border-radius:50px;font-size:13px;color:var(--tx);cursor:pointer;
}
.sort-select:focus{outline:none;border-color:var(--accent)}

/* Record grid */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:16px;
}
@media(max-width:400px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
.record-card{text-align:left;transition:transform .2s}
.record-card:hover{transform:translateY(-3px)}
.record-card:active{transform:scale(.97)}
.card-cover{
  aspect-ratio:1;background:var(--bg2);border-radius:var(--radius);
  overflow:hidden;margin-bottom:10px;position:relative;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.card-cover img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.record-card:hover .card-cover img{transform:scale(1.05)}
.card-cover .placeholder{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--bg2),var(--bg3));
}
.card-cover .placeholder svg{width:32px;height:32px;color:var(--tx3);opacity:.5}
.badge-want{
  position:absolute;top:8px;right:8px;
  background:var(--accent);color:#fff;
  font-size:9px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;
  padding:3px 8px;border-radius:50px;
}
.card-title{font-family:var(--serif);font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-artist{font-size:12px;color:var(--tx2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:5px}
.card-year{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.15em;font-family:var(--mono)}
.card-value{font-size:12px;font-weight:600;color:var(--tx)}

/* Empty state */
.empty{text-align:center;padding:80px 20px}
.empty svg{width:72px;height:72px;color:var(--tx3);opacity:.3;margin-bottom:20px}
.empty h2{font-family:var(--serif);font-size:28px;margin-bottom:8px}
.empty p{color:var(--tx2);font-size:14px;max-width:300px;margin:0 auto 28px}
.btn-primary{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--accent);color:#fff;
  padding:12px 28px;border-radius:50px;font-weight:600;font-size:14px;
  transition:all .2s;
}
.btn-primary:hover{background:var(--accent2)}

/* Modal overlay */
.modal-overlay{
  position:fixed;inset:0;z-index:40;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .2s;
}
@media(min-width:640px){.modal-overlay{align-items:center;padding:24px}}
.modal{
  background:var(--bg);width:100%;max-width:640px;
  max-height:95vh;max-height:95dvh;overflow-y:auto;
  border-radius:20px 20px 0 0;
  animation:fadeUp .3s ease-out;
}
@media(min-width:640px){.modal{border-radius:var(--radius-lg)}}
.modal-close{
  position:absolute;top:16px;right:16px;z-index:2;
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.2);color:#fff;transition:background .2s;
}
.modal-close:hover{background:rgba(0,0,0,.4)}

/* Modal header with cover */
.modal-hero{position:relative;padding:24px;display:flex;gap:16px}
.modal-hero-bg{position:absolute;inset:0;overflow:hidden;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.modal-hero-bg img{width:100%;height:100%;object-fit:cover;filter:blur(40px);opacity:.25}
.modal-cover{
  width:120px;height:120px;flex-shrink:0;
  background:var(--bg2);border-radius:var(--radius);overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.15);position:relative;z-index:1;
}
@media(min-width:640px){.modal-cover{width:150px;height:150px}}
.modal-cover img{width:100%;height:100%;object-fit:cover}
.modal-info{flex:1;min-width:0;padding-top:4px;position:relative;z-index:1}
.modal-title{font-family:var(--serif);font-size:24px;line-height:1.2}
@media(min-width:640px){.modal-title{font-size:30px}}
.modal-artist{color:var(--tx2);margin-top:4px;font-size:14px}
.modal-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:12px;color:var(--tx3)}

/* Form fields */
.modal-body{padding:0 24px 24px}
.field{margin-bottom:16px}
.field-label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:var(--tx3);margin-bottom:6px;font-weight:500}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;background:var(--card);
  border:1px solid var(--border);border-radius:var(--radius);
  font-size:14px;color:var(--tx);transition:border-color .2s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field textarea{resize:none;min-height:56px}
.field-price{position:relative}
.field-price .currency{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:14px}
.field-price input{padding-left:28px}
.checkbox-label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--tx2);cursor:pointer;margin-bottom:16px}
.checkbox-label input{width:16px;height:16px;accent-color:var(--accent)}

/* Value card */
.value-card{
  background:var(--tx);color:var(--bg);border-radius:var(--radius);
  padding:20px;margin-bottom:16px;
}
.value-card .label{font-size:10px;text-transform:uppercase;letter-spacing:.2em;opacity:.5}
.value-card .amount{font-family:var(--serif);font-size:36px;margin-top:6px}
.value-card .range{font-size:12px;opacity:.5;margin-top:4px}
.confidence{
  font-size:9px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;
  padding:3px 10px;border-radius:50px;float:right;
}
.confidence.high{background:rgba(52,211,153,.2);color:#34d399}
.confidence.medium{background:rgba(251,191,36,.2);color:#fbbf24}
.confidence.low{background:rgba(255,255,255,.15);color:rgba(255,255,255,.5)}
.value-meta{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);font-size:12px}
.value-meta dt{font-size:10px;text-transform:uppercase;letter-spacing:.15em;opacity:.4;margin-bottom:2px}
.profit-pos{color:#34d399}
.profit-neg{color:#f87171}

/* Tracklist */
.tracklist-header{font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:var(--tx3);margin-bottom:8px;font-weight:500}
.tracklist{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;margin-bottom:16px;
}
.track{
  display:flex;align-items:center;gap:12px;padding:10px 14px;
  font-size:13px;border-bottom:1px solid var(--border);
}
.track:last-child{border-bottom:none}
.track-pos{font-family:var(--mono);font-size:11px;color:var(--tx3);width:32px;flex-shrink:0}
.track-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track-dur{font-family:var(--mono);font-size:11px;color:var(--tx3)}

/* Condition boxes */
.condition-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.condition-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.condition-box .cb-label{font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:var(--tx3);margin-bottom:4px}
.condition-box .cb-grade{font-family:var(--serif);font-size:22px}
.condition-box .cb-name{font-size:12px;color:var(--tx2)}

/* Discogs link */
.discogs-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--tx2);margin-bottom:16px;transition:color .2s}
.discogs-link:hover{color:var(--accent)}
.discogs-link svg{width:14px;height:14px}

/* Action buttons */
.actions{display:flex;gap:8px;padding-top:16px;border-top:1px solid var(--border)}
.btn-fill{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--tx);color:var(--bg);
  padding:12px;border-radius:50px;font-size:14px;font-weight:600;
  transition:opacity .2s;
}
.btn-fill:hover{opacity:.85}
.btn-outline{
  display:flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--border);
  padding:12px 18px;border-radius:50px;font-size:14px;
  transition:background .2s;
}
.btn-outline:hover{background:var(--bg2)}
.btn-danger{background:#dc2626;color:#fff}
.btn-danger:hover{opacity:.85}

/* Scanner fullscreen */
.scanner{position:fixed;inset:0;z-index:50;background:#0a0a08;display:flex;flex-direction:column}
.scanner-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;position:relative;z-index:2;
}
.scanner-header h2{font-family:var(--serif);font-size:20px;color:#fff;letter-spacing:-.3px}
.scanner-header button{color:#eee;padding:8px}
.scanner-header .btn-text{font-size:13px;color:var(--accent2);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.scanner-body{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.scanner video{width:100%;height:100%;object-fit:cover}
.scan-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.scan-frame{width:280px;height:160px;position:relative}
.scan-corner{position:absolute;width:24px;height:24px;border-color:var(--accent2)}
.scan-corner.tl{top:0;left:0;border-top:2px solid;border-left:2px solid}
.scan-corner.tr{top:0;right:0;border-top:2px solid;border-right:2px solid}
.scan-corner.bl{bottom:0;left:0;border-bottom:2px solid;border-left:2px solid}
.scan-corner.br{bottom:0;right:0;border-bottom:2px solid;border-right:2px solid}
.scan-line{
  position:absolute;left:0;right:0;height:1px;
  background:var(--accent2);box-shadow:0 0 12px var(--accent2);
  animation:scanLine 2.5s ease-in-out infinite;
}
.scanner-hint{position:absolute;bottom:28px;left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-size:13px}
.scanner-center{padding:0 32px;text-align:center}
.scanner-center svg{width:48px;height:48px;color:var(--accent2);margin-bottom:16px}
.scanner-center p{color:rgba(255,255,255,.6);margin-bottom:24px;font-size:14px;line-height:1.6}
.manual-input{
  width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  color:#fff;padding:14px;border-radius:var(--radius);text-align:center;
  font-size:18px;letter-spacing:.15em;font-family:var(--mono);
}
.manual-input:focus{outline:none;border-color:var(--accent2)}
.manual-input::placeholder{color:rgba(255,255,255,.3);letter-spacing:.08em;font-size:14px}

/* Loading state */
.loading-screen{padding:60px 20px;text-align:center}
.loading-screen svg{width:48px;height:48px;color:var(--tx3);animation:spinSlow 1.5s linear infinite;margin-bottom:16px}
.loading-screen h3{font-family:var(--serif);font-size:20px;margin-bottom:8px}
.loading-screen p{font-family:var(--mono);font-size:13px;color:var(--tx3)}

/* Alert/error */
.alert{
  display:flex;gap:10px;padding:12px;
  background:var(--accent-bg);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);
  border-radius:var(--radius);margin-bottom:16px;font-size:13px;color:var(--tx2);
}
.alert svg{width:16px;height:16px;flex-shrink:0;margin-top:2px;color:var(--accent)}

/* Dashboard */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:32px}
@media(min-width:640px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat-card .stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:var(--tx3)}
.stat-card .stat-value{font-family:var(--serif);font-size:24px;margin-top:6px}
.stat-card .stat-sub{font-size:11px;color:var(--tx3);margin-top:2px}
.stat-accent-green .stat-value{color:#059669}
.stat-accent-red .stat-value{color:#dc2626}
.section-title{font-family:var(--serif);font-size:22px;margin-bottom:14px}
.bar-row{margin-bottom:10px}
.bar-row .bar-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar-row .bar-label span:last-child{color:var(--tx3)}
.bar-track{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--tx);border-radius:4px;transition:width .6s ease-out}
.bar-fill.accent{background:var(--accent)}
.decade-chart{display:flex;align-items:flex-end;gap:8px;height:120px;margin-bottom:32px}
.decade-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.decade-bar .db-count{font-size:11px;color:var(--tx3)}
.decade-bar .db-fill{width:100%;background:var(--accent);border-radius:4px 4px 0 0;transition:height .6s ease-out;min-height:2px}
.decade-bar .db-label{font-family:var(--mono);font-size:10px;color:var(--tx3)}
.top-list{display:flex;flex-direction:column;gap:8px}
.top-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.top-rank{font-family:var(--serif);font-size:24px;color:var(--tx3);width:28px;text-align:center}
.top-cover{width:48px;height:48px;background:var(--bg2);border-radius:6px;overflow:hidden;flex-shrink:0}
.top-cover img{width:100%;height:100%;object-fit:cover}
.top-info{flex:1;min-width:0}
.top-info .top-title{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-info .top-artist{font-size:12px;color:var(--tx2)}
.top-value{font-family:var(--mono);font-size:14px;font-weight:600;white-space:nowrap}

/* Settings */
.settings-section{margin-bottom:36px;max-width:560px}
.settings-section h3{font-family:var(--serif);font-size:22px;margin-bottom:8px}
.settings-section p{font-size:13px;color:var(--tx2);margin-bottom:16px;line-height:1.6}
.settings-section a{color:var(--accent);font-size:12px;display:inline-flex;align-items:center;gap:4px;margin-top:8px}
.btn-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.btn-row button{
  display:flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--border);padding:12px;border-radius:var(--radius);
  font-size:13px;font-weight:500;transition:background .2s;
}
.btn-row button:hover{background:var(--bg2)}
.btn-row button svg{width:16px;height:16px}
.info-box{
  background:var(--accent-bg);border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);
  border-radius:var(--radius);padding:16px;font-size:13px;line-height:1.6;
}
.info-box strong{display:block;margin-bottom:4px;color:var(--tx)}
.info-box p{color:var(--tx2)}

/* Toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;
  background:var(--tx);color:var(--bg);
  padding:12px 24px;border-radius:50px;font-size:14px;font-weight:500;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
  animation:fadeUp .3s ease-out;
}
.toast.error{background:#dc2626;color:#fff}

/* SVG icons inline helper */
.icon{width:16px;height:16px;display:inline-block;vertical-align:middle}
</style>
</head>
<body>

<div id="app"></div>

<script>
// ============================================================================
// STATE & STORAGE
// ============================================================================
const STORAGE_KEY = 'vinyl_radar_v1';
const SETTINGS_KEY = 'vinyl_radar_settings_v1';

let state = {
  records: [],
  settings: { discogsToken: '', currency: 'EUR' },
  view: 'library',
  scanning: false,
  lookup: null,
  detail: null,
  editing: null,
  search: '',
  sort: 'dateAdded',
  toast: null,
};

function loadState() {
  try {
    const r = localStorage.getItem(STORAGE_KEY);
    if (r) state.records = JSON.parse(r);
    const s = localStorage.getItem(SETTINGS_KEY);
    if (s) Object.assign(state.settings, JSON.parse(s));
  } catch(e) { console.warn('Load error:', e); }
}

function saveRecords() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.records));
}

function saveSettings() {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings));
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 8);
}

// ============================================================================
// VALUATION
// ============================================================================
const CONDITIONS = {
  'M':   { mult: 1.00, label: 'Mint',            desc: 'Absolutely perfect, sealed' },
  'NM':  { mult: 0.85, label: 'Near Mint',        desc: 'No visible flaws' },
  'VG+': { mult: 0.65, label: 'Very Good Plus',   desc: 'Light marks, plays well' },
  'VG':  { mult: 0.45, label: 'Very Good',        desc: 'Surface noise, no skips' },
  'G+':  { mult: 0.25, label: 'Good Plus',        desc: 'Heavy wear, plays through' },
  'G':   { mult: 0.15, label: 'Good',             desc: 'Significant wear' },
  'F':   { mult: 0.08, label: 'Fair',             desc: 'Damaged but playable' },
  'P':   { mult: 0.04, label: 'Poor',             desc: 'Severely damaged' },
};
const COND_ORDER = ['M','NM','VG+','VG','G+','G','F','P'];

function calcValue(r) {
  if (!r.market || !r.market.median) return null;
  const vm = (CONDITIONS[r.vinylCondition]?.mult ?? 0.5);
  const sm = (CONDITIONS[r.sleeveCondition]?.mult ?? 0.5);
  const blend = vm * 0.7 + sm * 0.3;
  const est = r.market.median * blend;
  const lo = (r.market.low ?? r.market.median * 0.6) * blend;
  const hi = (r.market.high ?? r.market.median * 1.4) * blend;
  const sales = r.market.salesCount ?? 0;
  let conf = 'low';
  if (sales > 50) conf = 'high';
  else if (sales > 10) conf = 'medium';
  return { estimate: Math.round(est*100)/100, low: Math.round(lo*100)/100, high: Math.round(hi*100)/100, confidence: conf, salesCount: sales };
}

function fmt(amount, cur) {
  if (amount == null) return '—';
  return new Intl.NumberFormat('en-NL', { style:'currency', currency: cur||'EUR', maximumFractionDigits:2 }).format(amount);
}

// ============================================================================
// API LOOKUPS
// ============================================================================
async function lookupBarcode(barcode) {
  const token = state.settings.discogsToken;
  const result = { barcode, artist:null, title:null, year:null, genre:null, label:null, catalogNumber:null, country:null, coverImage:null, tracklist:[], discogsId:null, discogsUri:null, market:null, source:null };

  // Discogs with token
  if (token) {
    try {
      const sr = await fetch(`https://api.discogs.com/database/search?barcode=${barcode}&format=Vinyl&type=release`, {
        headers: { 'User-Agent':'VinylRadar/1.0', 'Authorization':`Discogs token=${token}` }
      });
      if (sr.ok) {
        const sd = await sr.json();
        if (sd.results && sd.results[0]) {
          const rel = await fetch(`https://api.discogs.com/releases/${sd.results[0].id}`, {
            headers: { 'User-Agent':'VinylRadar/1.0', 'Authorization':`Discogs token=${token}` }
          }).then(r=>r.json());

          result.artist = (rel.artists||[]).map(a=>a.name).join(', ');
          result.title = rel.title;
          result.year = rel.year;
          result.genre = (rel.genres||[]).join(', ');
          result.label = rel.labels?.[0]?.name;
          result.catalogNumber = rel.labels?.[0]?.catno;
          result.country = rel.country;
          result.coverImage = rel.images?.[0]?.uri || rel.thumb;
          result.tracklist = (rel.tracklist||[]).map(t=>({ position:t.position, title:t.title, duration:t.duration }));
          result.discogsId = rel.id;
          result.discogsUri = rel.uri;
          result.source = 'discogs';

          // Market data
          const [statsRes, pricesRes] = await Promise.all([
            fetch(`https://api.discogs.com/marketplace/stats/${rel.id}?curr_abbr=EUR`, {
              headers: { 'User-Agent':'VinylRadar/1.0', 'Authorization':`Discogs token=${token}` }
            }).then(r=>r.ok?r.json():null).catch(()=>null),
            fetch(`https://api.discogs.com/marketplace/price_suggestions/${rel.id}`, {
              headers: { 'User-Agent':'VinylRadar/1.0', 'Authorization':`Discogs token=${token}` }
            }).then(r=>r.ok?r.json():null).catch(()=>null)
          ]);

          let median = statsRes?.lowest_price?.value ?? null;
          let low = null, high = null;
          if (pricesRes?.['Near Mint (NM or M-)']) median = pricesRes['Near Mint (NM or M-)'].value;
          if (pricesRes?.['Very Good Plus (VG+)']) low = pricesRes['Very Good Plus (VG+)'].value;
          if (pricesRes?.['Mint (M)']) high = pricesRes['Mint (M)'].value;

          if (median) {
            result.market = {
              median, low: low ?? median*0.7, high: high ?? median*1.3,
              salesCount: rel.num_for_sale ?? 0, currency: 'EUR'
            };
          }
          return result;
        }
      }
    } catch(e) { console.warn('Discogs auth lookup failed:', e); }
  }

  // Discogs without token
  try {
    const sr = await fetch(`https://api.discogs.com/database/search?barcode=${barcode}&format=Vinyl&type=release`, {
      headers: { 'User-Agent':'VinylRadar/1.0' }
    });
    if (sr.ok) {
      const sd = await sr.json();
      const r0 = sd.results?.[0];
      if (r0) {
        const parts = r0.title?.split(' - ') || [];
        result.artist = parts[0]; result.title = parts.slice(1).join(' - ') || r0.title;
        result.year = r0.year; result.genre = (r0.genre||[]).join(', ');
        result.label = r0.label?.[0]; result.catalogNumber = r0.catno;
        result.country = r0.country; result.coverImage = r0.cover_image;
        result.discogsId = r0.id; result.discogsUri = 'https://www.discogs.com' + r0.uri;
        result.source = 'discogs-public';
        return result;
      }
    }
  } catch(e) { console.warn('Discogs public failed:', e); }

  // MusicBrainz fallback
  try {
    const mr = await fetch(`https://musicbrainz.org/ws/2/release/?query=barcode:${barcode}&fmt=json`, {
      headers: { 'User-Agent':'VinylRadar/1.0 (personal-use)' }
    });
    if (mr.ok) {
      const md = await mr.json();
      const r0 = md.releases?.[0];
      if (r0) {
        result.artist = (r0['artist-credit']||[]).map(a=>a.name).join(', ');
        result.title = r0.title; result.year = r0.date?.substring(0,4);
        result.country = r0.country; result.source = 'musicbrainz';
        return result;
      }
    }
  } catch(e) { console.warn('MusicBrainz failed:', e); }

  return null;
}

// ============================================================================
// ICONS (SVG strings)
// ============================================================================
const IC = {
  disc: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><path d="M12 2a10 10 0 0 1 7.07 2.93"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
  x: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  music: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`,
  library: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
  chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
  heart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
  settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`,
  camera: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`,
  download: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
  upload: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`,
  edit: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
  ext: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`,
  alert: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  loader: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>`,
};

function icon(name, size) {
  return `<span class="icon" style="width:${size||16}px;height:${size||16}px">${IC[name]||''}</span>`;
}

// ============================================================================
// RENDERING
// ============================================================================
function render() {
  const app = document.getElementById('app');
  app.innerHTML = renderHeader() + renderTabs() + `<div class="app"><div class="content">${renderView()}</div></div>` + renderModals() + renderToast();
  bindEvents();
}

function renderHeader() {
  return `<header class="header"><div class="header-inner">
    <div class="logo">
      <span style="color:var(--tx)">${IC.disc}</span>
      <div class="logo-text"><h1>Vinyl Radar</h1><p>Collection Tracker</p></div>
    </div>
    <button class="btn-add" id="btn-scan">${icon('plus',16)} Add</button>
  </div></header>`;
}

function renderTabs() {
  const tabs = [
    { id:'library', label:'Library', ic:'library' },
    { id:'dashboard', label:'Stats', ic:'chart' },
    { id:'wishlist', label:'Wishlist', ic:'heart' },
    { id:'settings', label:'Settings', ic:'settings' },
  ];
  return `<nav class="tabs">${tabs.map(t =>
    `<button class="tab${state.view===t.id?' active':''}" data-view="${t.id}">${icon(t.ic,15)} ${t.label}</button>`
  ).join('')}</nav>`;
}

function renderView() {
  switch(state.view) {
    case 'library': return renderLibrary();
    case 'dashboard': return renderDashboard();
    case 'wishlist': return renderWishlist();
    case 'settings': return renderSettings();
    default: return '';
  }
}

// ---- Library ----
function getFiltered() {
  const q = state.search.toLowerCase();
  return state.records
    .filter(r => !r.wishlist)
    .filter(r => !q || (r.artist||'').toLowerCase().includes(q) || (r.title||'').toLowerCase().includes(q) || (r.genre||'').toLowerCase().includes(q) || (r.label||'').toLowerCase().includes(q))
    .sort((a,b) => {
      switch(state.sort) {
        case 'artist': return (a.artist||'').localeCompare(b.artist||'');
        case 'title': return (a.title||'').localeCompare(b.title||'');
        case 'year': return (b.year||0)-(a.year||0);
        case 'value': return (calcValue(b)?.estimate||0)-(calcValue(a)?.estimate||0);
        default: return new Date(b.dateAdded||0)-new Date(a.dateAdded||0);
      }
    });
}

function renderLibrary() {
  const owned = state.records.filter(r => !r.wishlist);
  if (owned.length === 0) {
    return `<div class="empty">${IC.disc}<h2>Your shelf is empty</h2><p>Scan the barcode on the back of any record sleeve to start building your collection.</p><button class="btn-primary" id="btn-scan-empty">Scan first record</button></div>`;  }
  const recs = getFiltered();
  return `<div class="search-bar">
    <div class="search-input">${IC.search}<input type="text" id="search-field" placeholder="Search artist, album, label..." value="${esc(state.search)}"></div>
    <select class="sort-select" id="sort-field">
      <option value="dateAdded"${state.sort==='dateAdded'?' selected':''}>Recently added</option>
      <option value="artist"${state.sort==='artist'?' selected':''}>Artist A–Z</option>
      <option value="title"${state.sort==='title'?' selected':''}>Title A–Z</option>
      <option value="year"${state.sort==='year'?' selected':''}>Year</option>
      <option value="value"${state.sort==='value'?' selected':''}>Value</option>
    </select>
  </div>` + (recs.length === 0 ? `<p style="text-align:center;color:var(--tx3);padding:48px 0">No records match your search.</p>` :
  `<div class="grid anim-stagger">${recs.map(r => renderCard(r)).join('')}</div>`);
}

function renderCard(r) {
  const v = calcValue(r);
  const cover = r.coverImage
    ? `<img src="${esc(r.coverImage)}" alt="${esc(r.title)}" loading="lazy">`
    : `<div class="placeholder">${IC.music}</div>`;
  return `<button class="record-card" data-detail="${r.id}">
    <div class="card-cover">${cover}${r.wishlist?'<div class="badge-want">Want</div>':''}</div>
    <div class="card-title">${esc(r.title||'Unknown')}</div>
    <div class="card-artist">${esc(r.artist||'Unknown artist')}</div>
    <div class="card-meta">
      <span class="card-year">${r.year||'—'}</span>
      ${v?`<span class="card-value">${fmt(v.estimate)}</span>`:''}
    </div>
  </button>`;
}

// ---- Dashboard ----
function renderDashboard() {
  const owned = state.records.filter(r => !r.wishlist);
  if (owned.length === 0) return `<div class="empty">${IC.chart}<p style="color:var(--tx3)">Add records to see your collection stats.</p></div>`;

  const totalEst = owned.reduce((s,r) => s+(calcValue(r)?.estimate||0), 0);
  const totalPaid = owned.reduce((s,r) => s+(r.purchasePrice||0), 0);
  const profit = totalEst - totalPaid;
  const profitClass = profit >= 0 ? 'stat-accent-green' : 'stat-accent-red';

  // Genres
  const gc = {};
  owned.forEach(r => { const gs = r.genre?.split(',').map(g=>g.trim()).filter(Boolean)||[]; if(!gs.length) gs.push('Unknown'); gs.forEach(g => gc[g]=(gc[g]||0)+1); });
  const topG = Object.entries(gc).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxG = Math.max(...topG.map(g=>g[1]),1);

  // Decades
  const dc = {};
  owned.forEach(r => { if(r.year){ const d=Math.floor(r.year/10)*10; dc[d]=(dc[d]||0)+1; }});
  const decs = Object.entries(dc).sort((a,b)=>a[0]-b[0]);
  const maxD = Math.max(...decs.map(d=>d[1]),1);

  // Top 5
  const top5 = [...owned].map(r=>({...r,_v:calcValue(r)?.estimate||0})).sort((a,b)=>b._v-a._v).slice(0,5);

  return `<div class="stats-grid anim-stagger">
    <div class="stat-card"><div class="stat-label">Records</div><div class="stat-value">${owned.length}</div><div class="stat-sub">in collection</div></div>
    <div class="stat-card"><div class="stat-label">Total value</div><div class="stat-value">${fmt(totalEst)}</div><div class="stat-sub">estimated</div></div>
    <div class="stat-card"><div class="stat-label">Total paid</div><div class="stat-value">${fmt(totalPaid)}</div><div class="stat-sub">purchases logged</div></div>
    <div class="stat-card ${profitClass}"><div class="stat-label">${profit>=0?'Appreciation':'Loss'}</div><div class="stat-value">${fmt(Math.abs(profit))}</div><div class="stat-sub">${profit>=0?'in your favor':'on paper'}</div></div>
  </div>
  <h3 class="section-title">Top genres</h3>
  <div style="margin-bottom:32px">${topG.map(([g,c])=>`<div class="bar-row"><div class="bar-label"><span>${esc(g)}</span><span>${c}</span></div><div class="bar-track"><div class="bar-fill" style="width:${(c/maxG*100)}%"></div></div></div>`).join('')}</div>
  ${decs.length?`<h3 class="section-title">By decade</h3><div class="decade-chart">${decs.map(([d,c])=>`<div class="decade-bar"><div class="db-count">${c}</div><div class="db-fill" style="height:${(c/maxD*100)}%"></div><div class="db-label">${d}s</div></div>`).join('')}</div>`:''}
  <h3 class="section-title">Most valuable</h3>
  <div class="top-list anim-stagger">${top5.map((r,i)=>`<div class="top-item">
    <div class="top-rank">${i+1}</div>
    <div class="top-cover">${r.coverImage?`<img src="${esc(r.coverImage)}" alt="">`:''}</div>
    <div class="top-info"><div class="top-title">${esc(r.title)}</div><div class="top-artist">${esc(r.artist)}</div></div>
    <div class="top-value">${fmt(r._v)}</div>
  </div>`).join('')}</div>`;
}

// ---- Wishlist ----
function renderWishlist() {
  const wl = state.records.filter(r => r.wishlist);
  if (!wl.length) return `<div class="empty">${IC.heart}<h2>No wants yet</h2><p>When adding a record, check "wishlist" to track it without owning it.</p></div>`;
  return `<div class="grid anim-stagger">${wl.map(r => renderCard(r)).join('')}</div>`;
}

// ---- Settings ----
function renderSettings() {
  return `<div class="settings-section">
    <h3>Discogs integration</h3>
    <p>A free personal access token unlocks full tracklists, cover art, market prices, and condition-based valuation. The app works without one, but with limited data.</p>
    <div class="field"><label class="field-label">Personal access token</label>
      <input type="password" id="discogs-token" placeholder="paste your token here" value="${esc(state.settings.discogsToken)}" style="font-family:var(--mono)">
    </div>
    <a href="https://www.discogs.com/settings/developers" target="_blank">${icon('ext',12)} Generate a token at discogs.com/settings/developers</a>
  </div>
  <div class="settings-section">
    <h3>Backup &amp; export</h3>
    <p>Your collection lives in this device's local storage. Export regularly — especially before clearing browser data.</p>
    <div class="btn-row">
      <button id="btn-export-json">${icon('download')} JSON backup</button>
      <button id="btn-export-csv">${icon('download')} CSV export</button>
      <button id="btn-import-json">${icon('upload')} Restore JSON</button>
    </div>
    <input type="file" id="file-import" accept=".json" style="display:none">
  </div>
  <div class="settings-section">
    <h3>Google Drive sync</h3>
    <div class="info-box"><strong>Coming in v2</strong><p>For now, save your JSON backup to your Google Drive folder manually. Once this app runs on its own domain with OAuth, auto-sync will be added.</p></div>
  </div>
  <div class="settings-section">
    <h3>About</h3>
    <p><strong>Vinyl Radar</strong> v1.0 — your private vinyl collection tracker.</p>
    <p>${state.records.length} records · ${state.records.filter(r=>r.wishlist).length} on wishlist</p>
    <p style="font-size:11px;color:var(--tx3);margin-top:8px">Data: Discogs · MusicBrainz · Goldmine grading standard</p>
  </div>`;
}

// ---- Modals ----
function renderModals() {
  let html = '';
  if (state.scanning) html += renderScanner();
  if (state.lookup) html += renderLookupModal();
  if (state.detail) html += renderDetailModal();
  if (state.editing) html += renderEditModal();
  return html;
}

function renderScanner() {
  return `<div class="scanner" id="scanner">
    <div class="scanner-header">
      <button id="scanner-close">${IC.x}</button>
      <h2>Scan barcode</h2>
      <button class="btn-text" id="scanner-toggle-manual">Manual</button>
    </div>
    <div class="scanner-body" id="scanner-body">
      <div id="scanner-camera-area" style="width:100%;height:100%;position:relative">
        <video id="scanner-video" playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
        <div class="scan-overlay"><div class="scan-frame">
          <div class="scan-corner tl"></div><div class="scan-corner tr"></div>
          <div class="scan-corner bl"></div><div class="scan-corner br"></div>
          <div class="scan-line"></div>
        </div></div>
        <div class="scanner-hint">Hold barcode steady within frame</div>
      </div>
      <div id="scanner-manual-area" style="display:none" class="scanner-center">
        <p>Enter the barcode number from the back of the sleeve</p>
        <input type="text" inputmode="numeric" id="manual-barcode" class="manual-input" placeholder="e.g. 0602567890123">
        <button class="btn-primary" id="btn-manual-lookup" style="width:100%;margin-top:16px;justify-content:center">Look up</button>
      </div>

}

function renderLookupModal() {
  const s = state.lookup;
  if (s.loading) {
    return `<div class="modal-overlay"><div class="modal"><div class="loading-screen">
      ${IC.loader}<h3>Looking up barcode</h3><p>${esc(s.barcode)}</p>
    </div></div></div>`;
  }
  return renderRecordForm(s.result, s.error, false);
}

function renderEditModal() {
  return renderRecordForm(state.editing, null, true);
}

function renderRecordForm(data, error, isEdit) {
  const d = data || {};
  const v = d.market ? calcValue(d) : null;
  const cover = d.coverImage
    ? `<img src="${esc(d.coverImage)}" style="width:100%;height:100%;object-fit:cover">`
    : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg2)">${IC.music}</div>`;
  const heroBg = d.coverImage ? `<div class="modal-hero-bg"><img src="${esc(d.coverImage)}"></div>` : '';

  const condOpts = COND_ORDER.map(c => `<option value="${c}"${(d.vinylCondition||'NM')===c?' selected':''}>${c} – ${CONDITIONS[c].label}</option>`).join('');
  const condOpts2 = COND_ORDER.map(c => `<option value="${c}"${(d.sleeveCondition||'NM')===c?' selected':''}>${c} – ${CONDITIONS[c].label}</option>`).join('');

  let valueCard = '';
  if (v) {
    valueCard = `<div class="value-card">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="label">Estimated value</span><span class="confidence ${v.confidence}">${v.confidence} confidence</span></div>
      <div class="amount">${fmt(v.estimate)}</div>
      <div class="range">Range: ${fmt(v.low)} – ${fmt(v.high)}</div>
    </div>`;
  }

  let tracklistHtml = '';
  if (d.tracklist && d.tracklist.length) {
    tracklistHtml = `<div class="tracklist-header">Tracklist</div><div class="tracklist">${d.tracklist.map(t =>
      `<div class="track"><span class="track-pos">${esc(t.position||'')}</span><span class="track-title">${esc(t.title||'')}</span>${t.duration?`<span class="track-dur">${esc(t.duration)}</span>`:''}</div>`
    ).join('')}</div>`;
  }

  const alertHtml = error && !d.title ? `<div class="alert">${IC.alert}<p>${esc(error)}</p></div>` : '';

  const manualFields = (!d.title || !d.artist) ? `
    <div class="field"><label class="field-label">Artist</label><input type="text" id="form-artist" value="${esc(d.artist||'')}"></div>
    <div class="field"><label class="field-label">Title</label><input type="text" id="form-title" value="${esc(d.title||'')}"></div>` : '';

  return `<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-hero">${heroBg}
        <button class="modal-close" id="modal-close">${IC.x}</button>
        <div class="modal-cover">${cover}</div>
        <div class="modal-info">
          <div class="modal-title">${esc(d.title||'Unknown title')}</div>
          <div class="modal-artist">${esc(d.artist||'Unknown artist')}</div>
          <div class="modal-tags">${d.year?`<span>${d.year}</span>`:''}${d.label?`<span>· ${esc(d.label)}</span>`:''}${d.country?`<span>· ${esc(d.country)}</span>`:''}</div>
        </div>
      </div>
      <div class="modal-body">
        ${alertHtml}${manualFields}
        <div class="field-row">
          <div class="field"><label class="field-label">Vinyl condition</label><select id="form-vinyl-cond">${condOpts}</select></div>
          <div class="field"><label class="field-label">Sleeve condition</label><select id="form-sleeve-cond">${condOpts2}</select></div>
        </div>
        <div class="field-row">
          <div class="field"><label class="field-label">Purchase price</label><div class="field-price"><span class="currency">€</span><input type="number" step="0.01" id="form-price" placeholder="0.00" value="${d.purchasePrice||''}"></div></div>
          <div class="field"><label class="field-label">Purchase date</label><input type="date" id="form-date" value="${esc(d.purchaseDate||'')}"></div>
        </div>
        <div class="field"><label class="field-label">Notes</label><textarea id="form-notes" placeholder="Where you bought it, special edition...">${esc(d.notes||'')}</textarea></div>
        <label class="checkbox-label"><input type="checkbox" id="form-wishlist" ${d.wishlist?'checked':''}> Add to wishlist instead (don't own yet)</label>
        ${valueCard}${tracklistHtml}
        <div class="actions">
          ${isEdit?'':`<button class="btn-outline" id="btn-rescan">Rescan</button>`}
          <button class="btn-fill" id="btn-save">${isEdit?'Save changes':'Add to collection'}</button>
        </div>
      </div>
    </div>
  </div>`;
}

function renderDetailModal() {
  const r = state.detail;
  const v = calcValue(r);
  const cover = r.coverImage
    ? `<img src="${esc(r.coverImage)}" style="width:100%;height:100%;object-fit:cover">`
    : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg2)">${IC.music}</div>`;

  let valueCard = '';
  if (v) {

      const diff = v.estimate - r.purchasePrice;
      profitHtml = `<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)">
        <span style="opacity:.4;font-size:10px;text-transform:uppercase;letter-spacing:.15em">Paid${r.purchaseDate?' · '+new Date(r.purchaseDate).toLocaleDateString():''}</span>
        <span>${fmt(r.purchasePrice)} <span class="${diff>=0?'profit-pos':'profit-neg'}">${diff>=0?'+':''}${fmt(diff)}</span></span>
      </div>`;
    }
    valueCard = `<div class="value-card">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="label">Estimated value</span><span class="confidence ${v.confidence}">${v.confidence} confidence</span></div>
      <div class="amount">${fmt(v.estimate)}</div>
      <div class="range">Range: ${fmt(v.low)} – ${fmt(v.high)}</div>
      <div class="value-meta"><div><dt>Median market</dt><dd>${fmt(r.market?.median)}</dd></div><div><dt>For sale</dt><dd>${v.salesCount} copies</dd></div></div>
      ${profitHtml}
    </div>`;
  }

  const genres = r.genre ? r.genre.split(',').map(g => `<span style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;background:var(--bg2);padding:3px 10px;border-radius:50px">${esc(g.trim())}</span>`).join(' ') : '';

  let tracklistHtml = '';
  if (r.tracklist && r.tracklist.length) {
    tracklistHtml = `<div class="tracklist-header">Tracklist</div><div class="tracklist">${r.tracklist.map(t =>
      `<div class="track"><span class="track-pos">${esc(t.position||'')}</span><span class="track-title">${esc(t.title||'')}</span>${t.duration?`<span class="track-dur">${esc(t.duration)}</span>`:''}</div>`
    ).join('')}</div>`;
  }

  const discogsLink = r.discogsUri ? `<a class="discogs-link" href="${r.discogsUri.startsWith('http')?r.discogsUri:'https://www.discogs.com'+r.discogsUri}" target="_blank">${icon('ext',14)} View on Discogs</a>` : '';

  return `<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-hero">${heroBg}
        <button class="modal-close" id="modal-close">${IC.x}</button>
        <div class="modal-cover">${cover}</div>
        <div class="modal-info">
          <div class="modal-title">${esc(r.title)}</div>
          <div class="modal-artist">${esc(r.artist)}</div>
          <div class="modal-tags">${r.year?`<span>${r.year}</span>`:''}${r.label?`<span>· ${esc(r.label)}</span>`:''}${r.country?`<span>· ${esc(r.country)}</span>`:''}</div>
          ${genres?`<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px">${genres}</div>`:''}
        </div>
      </div>
      <div class="modal-body">
        ${valueCard}
        <div class="condition-grid">
          <div class="condition-box"><div class="cb-label">Vinyl</div><div class="cb-grade">${esc(r.vinylCondition)}</div><div class="cb-name">${CONDITIONS[r.vinylCondition]?.label||''}</div></div>
          <div class="condition-box"><div class="cb-label">Sleeve</div><div class="cb-grade">${esc(r.sleeveCondition)}</div><div class="cb-name">${CONDITIONS[r.sleeveCondition]?.label||''}</div></div>
        </div>
        ${tracklistHtml}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px;margin-bottom:16px">
          ${r.catalogNumber?`<div><div class="field-label">Catalog #</div><div style="font-family:var(--mono)">${esc(r.catalogNumber)}</div></div>`:''}
          ${r.barcode?`<div><div class="field-label">Barcode</div><div style="font-family:var(--mono)">${esc(r.barcode)}</div></div>`:''}
        </div>
        ${r.notes?`<div style="margin-bottom:16px"><div class="field-label">Notes</div><p style="font-size:14px;color:var(--tx2);white-space:pre-wrap">${esc(r.notes)}</p></div>`:''}
        ${discogsLink}
        <div class="actions">
          <button class="btn-fill" id="btn-edit">${icon('edit')} Edit</button>
          <button class="btn-outline" id="btn-delete">${icon('trash')} Delete</button>
        </div>
      </div>
    </div>
  </div>`;
}

function renderToast() {
  if (!state.toast) return '';
  return `<div class="toast${state.toast.type==='error'?' error':''}">${esc(state.toast.message)}</div>`;
}

function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toast(msg, type) {
  state.toast = { message: msg, type: type||'success' };
  render();
  setTimeout(() => { state.toast = null; render(); }, 3500);
}

// ============================================================================
// EVENT BINDING
// ============================================================================
let scannerStream = null;
let scannerInterval = null;
let isManualMode = false;

function bindEvents() {
  // Header add
  on('btn-scan', 'click', () => openScanner());
  on('btn-scan-empty', 'click', () => openScanner());

  // Tabs
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => { state.view = t.dataset.view; render(); });
  });

  // Search
  const sf = document.getElementById('search-field');
  if (sf) sf.addEventListener('input', (e) => { state.search = e.target.value; render(); document.getElementById('search-field')?.focus(); });
  const so = document.getElementById('sort-field');
  if (so) so.addEventListener('change', (e) => { state.sort = e.target.value; render(); });

  // Cards -> detail
  document.querySelectorAll('[data-detail]').forEach(el => {
    el.addEventListener('click', () => { state.detail = state.records.find(r => r.id === el.dataset.detail); render(); });
  });

  // Modal close
  on('modal-close', 'click', closeModals);
  on('modal-overlay', 'click', (e) => { if (e.target.id === 'modal-overlay') closeModals(); });

  // Scanner
  on('scanner-close', 'click', closeScanner);
  on('scanner-toggle-manual', 'click', toggleScannerMode);
  on('btn-manual-lookup', 'click', () => {
    const code = document.getElementById('manual-barcode')?.value?.trim();
    if (code) { closeScanner(); doLookup(code); }
  });
  const mi = document.getElementById('manual-barcode');
  if (mi) mi.addEventListener('keydown', (e) => { if (e.key==='Enter') document.getElementById('btn-manual-lookup')?.click(); });

  // Form save
  on('btn-save', 'click', saveForm);
  on('btn-rescan', 'click', () => { state.lookup = null; render(); openScanner(); });

  // Detail actions
  on('btn-edit', 'click', () => {
    state.editing = { ...state.detail };
    state.detail = null;
    render();
  });
  on('btn-delete', 'click', () => {
    if (confirm('Remove this record from your collection?')) {
      state.records = state.records.filter(r => r.id !== state.detail.id);
      saveRecords();
      state.detail = null;
      render();
      toast('Record removed');
    }
  });

  // Settings
  const dt = document.getElementById('discogs-token');
  if (dt) dt.addEventListener('change', () => { state.settings.discogsToken = dt.value; saveSettings(); toast('Token saved'); });

  on('btn-export-json', 'click', exportJSON);
  on('btn-export-csv', 'click', exportCSV);
  on('btn-import-json', 'click', () => document.getElementById('file-import')?.click());
  const fi = document.getElementById('file-import');
  if (fi) fi.addEventListener('change', importJSON);

  // Start camera if scanner is open
  if (state.scanning && !isManualMode) startCamera();
}

function on(id, evt, fn) {
  const el = document.getElementById(id);
  if (el) el.addEventListener(evt, fn);
}

function closeModals() {
  state.lookup = null;
  state.detail = null;
  state.editing = null;
  render();
}

// ============================================================================
// SCANNER LOGIC
// ============================================================================
function openScanner() {
  state.scanning = true;
  isManualMode = false;
  render();
}

function closeScanner() {
  stopCamera();
  state.scanning = false;
  isManualMode = false;
  render();
}

function toggleScannerMode() {
  isManualMode = !isManualMode;
  const cam = document.getElementById('scanner-camera-area');
  const man = document.getElementById('scanner-manual-area');
  const btn = document.getElementById('scanner-toggle-manual');
  if (isManualMode) {
    stopCamera();
    if (cam) cam.style.display = 'none';
    if (man) man.style.display = 'block';
    if (btn) btn.textContent = 'Camera';
    document.getElementById('manual-barcode')?.focus();
  } else {
    if (cam) cam.style.display = 'block';
    if (man) man.style.display = 'none';
    if (btn) btn.textContent = 'Manual';
    startCamera();
  }
}

async function startCamera() {
  const video = document.getElementById('scanner-video');
  if (!video) return;

  if (!('BarcodeDetector' in window)) {
    // No BarcodeDetector, force manual
    isManualMode = true;
    const cam = document.getElementById('scanner-camera-area');
    const man = document.getElementById('scanner-manual-area');
    const btn = document.getElementById('scanner-toggle-manual');
    if (cam) cam.style.display = 'none';
    if (man) { man.style.display = 'block'; man.innerHTML = `<div>${IC.alert}</div><p>Your browser doesn't support barcode scanning. Enter the code manually.</p><input type="text" inputmode="numeric" id="manual-barcode" class="manual-input" placeholder="e.g. 0602567890123"><button class="btn-primary" id="btn-manual-lookup" style="width:100%;margin-top:16px;justify-content:center">Look up</button>`; }
    if (btn) btn.style.display = 'none';
    on('btn-manual-lookup', 'click', () => { const c=document.getElementById('manual-barcode')?.value?.trim(); if(c){closeScanner();doLookup(c);} });
    return;
  }

  try {
    scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = scannerStream;
    await video.play();

    const detector = new BarcodeDetector({ formats: ['ean_13','ean_8','upc_a','upc_e','code_128','code_39'] });
    scannerInterval = setInterval(async () => {
      try {
        const codes = await detector.detect(video);
        if (codes.length > 0) {
          const code = codes[0].rawValue;
          closeScanner();
          doLookup(code);
        }
      } catch(e) {}
    }, 300);
  } catch(e) {
    // Camera error, switch to manual
    toggleScannerMode();
  }
}

function stopCamera() {
  if (scannerInterval) { clearInterval(scannerInterval); scannerInterval = null; }
  if (scannerStream) { scannerStream.getTracks().forEach(t => t.stop()); scannerStream = null; }
}

// ============================================================================
// LOOKUP & SAVE
// ============================================================================
async function doLookup(barcode) {
  state.lookup = { loading: true, barcode };
  render();

  try {
    const result = await lookupBarcode(barcode);
    if (!result) {
      state.lookup = { loading: false, barcode, error: 'No release found for this barcode.', result: { barcode, vinylCondition:'NM', sleeveCondition:'NM' } };
    } else {
      result.vinylCondition = result.vinylCondition || 'NM';
      result.sleeveCondition = result.sleeveCondition || 'NM';
      state.lookup = { loading: false, barcode, result };
    }
  } catch(e) {
    state.lookup = { loading: false, barcode, error: e.message, result: { barcode, vinylCondition:'NM', sleeveCondition:'NM' } };
  }
  render();
}

function saveForm() {
  const isEdit = !!state.editing;
  const base = isEdit ? state.editing : (state.lookup?.result || {});

  const data = { ...base };
  const fa = document.getElementById('form-artist');
  const ft = document.getElementById('form-title');
  if (fa) data.artist = fa.value;
  if (ft) data.title = ft.value;
  data.vinylCondition = document.getElementById('form-vinyl-cond')?.value || 'NM';
  data.sleeveCondition = document.getElementById('form-sleeve-cond')?.value || 'NM';
  const pp = document.getElementById('form-price')?.value;
  data.purchasePrice = pp ? parseFloat(pp) : null;
  data.purchaseDate = document.getElementById('form-date')?.value || '';
  data.notes = document.getElementById('form-notes')?.value || '';
  data.wishlist = document.getElementById('form-wishlist')?.checked || false;

  if (isEdit && data.id) {
    state.records = state.records.map(r => r.id === data.id ? { ...r, ...data } : r);
    toast('Record updated');
  } else {
    data.id = uid();
    data.dateAdded = new Date().toISOString();
    state.records.unshift(data);
    toast('Added to collection');
  }

  saveRecords();
  state.lookup = null;
  state.editing = null;
  render();
}

// ============================================================================
// EXPORT / IMPORT
// ============================================================================
function exportJSON() {
  const blob = new Blob([JSON.stringify({ records: state.records, settings: state.settings, exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' });
  dl(blob, `vinyl-radar-${new Date().toISOString().split('T')[0]}.json`);
  toast('Backup downloaded');
}

function exportCSV() {
  const h = ['Artist','Title','Year','Label','Catalog#','Barcode','Genre','Vinyl','Sleeve','Paid','Purchase Date','Estimated Value','Notes','Wishlist'];
  const rows = state.records.map(r => {
    const v = calcValue(r);
    return [r.artist,r.title,r.year,r.label,r.catalogNumber,r.barcode,r.genre,r.vinylCondition,r.sleeveCondition,r.purchasePrice,r.purchaseDate,v?.estimate||'',r.notes,r.wishlist?'Yes':''].map(v => `"${(v??'').toString().replace(/"/g,'""')}"`).join(',');
  });
  const csv = [h.join(','), ...rows].join('\n');
  dl(new Blob([csv], { type:'text/csv' }), `vinyl-radar-${new Date().toISOString().split('T')[0]}.csv`);
  toast('CSV exported');
}

function importJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (Array.isArray(d.records)) {
        state.records = d.records;
        saveRecords();
        if (d.settings) { Object.assign(state.settings, d.settings); saveSettings(); }
        toast(`Restored ${d.records.length} records`);
        render();
      } else { toast('Invalid backup file', 'error'); }
    } catch(er) { toast('Could not read file', 'error'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function dl(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ============================================================================
// SERVICE WORKER REGISTRATION
// ============================================================================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'activated' && navigator.serviceWorker.controller) {
            toast('App updated — refresh for the latest version');
          }
        });
      });
    }).catch(err => console.log('SW registration failed:', err));
  });
}

// ============================================================================
// INIT
// ============================================================================
loadState();
render();
</script>
