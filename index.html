function renderToast() {
  if (!state.toast) return '';
  return `<div class="toast${state.toast.type==='error'?' error':''}">${esc(state.toast.message)}</div>`;
}

function renderCollectionModal() {
  const m = state.collectionModal;
  if (!m) return '';
  if (m.mode === 'list') {
    return `<div class="modal-overlay" id="modal-overlay">
      <div class="modal" style="max-height:80vh">
        <div class="modal-hero" style="padding:20px;min-height:auto">
          <button class="modal-close" id="modal-close">${IC.x}</button>
          <div><h2 style="font-family:var(--serif);font-size:28px">Collections</h2><p style="font-size:12px;color:var(--tx2);margin-top:4px">Saved views over your library. They don't duplicate records.</p></div>
        </div>
        <div class="col-modal-body">
          <button class="btn-fill" id="btn-col-create" style="width:100%;justify-content:center;margin-bottom:16px">${icon('plus',14)} New collection</button>
          ${state.collections.length === 0 ? `<p style="font-size:13px;color:var(--tx3);text-align:center;padding:24px 0">No collections yet. Create one to save a filter set as a quick-access view.</p>` :
            `<div class="col-list">${state.collections.map(c => {
              const count = c.type === 'manual' ? (c.recordIds?.length || 0) : applyFilters(state.records.filter(r=>!r.wishlist), c.filters||{}).length;
              return `<div class="col-list-row">
                <span>${icon('folder',14)} ${esc(c.name)} <span class="col-meta">· ${count} records · ${c.type === 'manual' ? 'manual' : 'filter'}</span></span>
                <button data-col-del="${c.id}">Delete</button>
              </div>`;
            }).join('')}</div>`}
        </div>
      </div>
    </div>`;
  }
  if (m.mode === 'create') {
    const filterCount = activeFilterCount();
    const matched = filterCount > 0 ? applyFilters(state.records.filter(r=>!r.wishlist), state.filters).length : 0;
    return `<div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-hero" style="padding:20px;min-height:auto">
          <button class="modal-close" id="modal-close">${IC.x}</button>
          <div><h2 style="font-family:var(--serif);font-size:28px">New collection</h2></div>
        </div>
        <div class="col-modal-body">
          <div class="field"><label class="field-label">Name</label><input type="text" id="col-name" placeholder="Jazz shelf, For trade, In storage..." autofocus></div>
          <p class="col-hint">Choose how this collection works:</p>
          <div class="col-type-row">
            <button class="col-type-btn ${m.type === 'filter' ? 'active' : ''}" data-col-type="filter">
              <strong>Filter view</strong>
              <span>Saves the filters currently active. Auto-updates as you add records.</span>
            </button>
            <button class="col-type-btn ${m.type === 'manual' ? 'active' : ''}" data-col-type="manual">
              <strong>Manual list</strong>
              <span>Pick records by hand. Stays put unless you edit it.</span>
            </button>
          </div>
          ${m.type === 'filter' ? (filterCount === 0
            ? `<div class="info-box"><strong>No filters active</strong><p>Go back, apply some filters, then create the collection from them.</p></div>`
            : `<div class="info-box"><strong>Will save ${filterCount} filter${filterCount===1?'':'s'} → ${matched} record${matched===1?'':'s'}</strong><p>Active filters: ${describeActiveFilters()}</p></div>`) : ''}
          ${m.type === 'manual' ? `<div class="info-box"><strong>Manual list</strong><p>You can add records to this collection later from the record detail view.</p></div>` : ''}
          <div class="actions" style="margin-top:18px">
            <button class="btn-outline" id="btn-col-cancel">Cancel</button>
            <button class="btn-fill" id="btn-col-save">Create</button>
          </div>
        </div>
      </div>
    </div>`;
  }
  return '';
}

function describeActiveFilters() {
  const f = state.filters;
  const parts = [];
  if (f.formats.length) parts.push(f.formats.join('/'));
  if (f.genres.length) parts.push(f.genres.join('/'));
  if (f.decades.length) parts.push(f.decades.map(d => d+'s').join('/'));
  if (f.condMin) parts.push(f.condMin + '+');
  if (f.countries.length) parts.push(f.countries.join('/'));
  if (f.tags.length) parts.push('tags: ' + f.tags.join('/'));
  if (f.forSale) parts.push('for sale');
  return parts.join(' · ');
}

function createCollection(name, type) {
  const c = {
    id: uid(),
    name: name.trim(),
    type,
    createdAt: new Date().toISOString(),
  };
  if (type === 'filter') {
    c.filters = JSON.parse(JSON.stringify(state.filters));
  } else {
    c.recordIds = [];
  }
  state.collections.push(c);
  saveCollections();
  state.activeCollection = c.id;
  saveFilters();
  toast('Collection created');
  return c;
}

function deleteCollection(id) {
  state.collections = state.collections.filter(c => c.id !== id);
  if (state.activeCollection === id) state.activeCollection = null;
  saveCollections();
  saveFilters();
}

function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toast(msg, type) {
  state.toast = { message: msg, type: type||'success' };
  render();
  setTimeout(() => { state.toast = null; render(); }, 3500);
}

// ============================================================================
// EVENT BINDING
// ============================================================================
let scannerStream = null;
let scannerInterval = null;
let isManualMode = false;

function bindEvents() {
  // Header add
  on('btn-scan', 'click', () => openScanner());
  on('btn-scan-empty', 'click', () => openScanner());

  // Tabs
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => { state.view = t.dataset.view; render(); });
  });

  // Search
  const sf = document.getElementById('search-field');
  if (sf) sf.addEventListener('input', (e) => { state.search = e.target.value; render(); document.getElementById('search-field')?.focus(); });
  const so = document.getElementById('sort-field');
  if (so) so.addEventListener('change', (e) => { state.sort = e.target.value; saveFilters(); render(); });

  // R1 — filter chips
  document.querySelectorAll('[data-flt-group]').forEach(el => {
    el.addEventListener('click', () => {
      const group = el.dataset.fltGroup;
      let val = el.dataset.fltVal;
      if (group === 'decades') val = parseInt(val, 10);
      toggleFilter(group, val);
      render();
    });
  });
  document.querySelectorAll('[data-flt-cond]').forEach(el => {
    el.addEventListener('click', () => {
      const v = el.dataset.fltCond;
      state.filters.condMin = state.filters.condMin === v ? null : v;
      saveFilters();
      render();
    });
  });
  document.querySelectorAll('[data-flt-forsale]').forEach(el => {
    el.addEventListener('click', () => {
      state.filters.forSale = !state.filters.forSale;
      saveFilters();
      render();
    });
  });
  on('btn-clear-filters', 'click', () => { clearFilters(); render(); });

  // R1 — collection switching
  document.querySelectorAll('[data-col]').forEach(el => {
    el.addEventListener('click', (e) => {
      if (el.id === 'btn-manage-collection') return;
      const id = el.dataset.col;
      state.activeCollection = id || null;
      saveFilters();
      render();
    });
  });
  on('btn-new-collection', 'click', () => {
    state.collectionModal = { mode: 'create', type: 'filter' };
    render();
  });
  on('btn-manage-collection', 'click', () => {
    state.collectionModal = { mode: 'list' };
    render();
  });

  // R1 — collection modal
  document.querySelectorAll('[data-col-type]').forEach(el => {
    el.addEventListener('click', () => {
      if (state.collectionModal) {
        state.collectionModal.type = el.dataset.colType;
        render();
      }
    });
  });
  on('btn-col-cancel', 'click', () => { state.collectionModal = null; render(); });
  on('btn-col-save', 'click', () => {
    const name = document.getElementById('col-name')?.value || '';
    if (!name.trim()) { toast('Name required', 'error'); return; }
    const type = state.collectionModal?.type || 'filter';
    if (type === 'filter' && activeFilterCount() === 0) {
      toast('Apply some filters first', 'error');
      return;
    }
    createCollection(name, type);
    state.collectionModal = null;
    render();
  });
  on('btn-col-create', 'click', () => {
    state.collectionModal = { mode: 'create', type: 'filter' };
    render();
  });
  document.querySelectorAll('[data-col-del]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.colDel;
      if (confirm('Delete this collection? Records stay in your library.')) {
        deleteCollection(id);
        toast('Collection deleted');
        render();
      }
    });
  });

  // Cards -> detail
  document.querySelectorAll('[data-detail]').forEach(el => {
    el.addEventListener('click', () => { state.detail = state.records.find(r => r.id === el.dataset.detail); render(); });
  });

  // Modal close
  on('modal-close', 'click', closeModals);
  on('modal-overlay', 'click', (e) => { if (e.target.id === 'modal-overlay') closeModals(); });

  // Scanner
  on('scanner-close', 'click', closeScanner);
  on('scanner-toggle-manual', 'click', toggleScannerMode);
  on('btn-manual-lookup', 'click', () => {
    const code = document.getElementById('manual-barcode')?.value?.trim();
    if (code) { closeScanner(); doLookup(code); }
  });
  on('btn-no-barcode', 'click', () => {
    closeScanner();
    state.lookup = { loading: false, barcode: null, result: { vinylCondition:'NM', sleeveCondition:'NM', media_condition:'NM', sleeve_condition:'NM', confidence:'low' } };
    render();
  });
  const mi = document.getElementById('manual-barcode');
  if (mi) mi.addEventListener('keydown', (e) => { if (e.key==='Enter') document.getElementById('btn-manual-lookup')?.click(); });

  // Form save
  on('btn-save', 'click', saveForm);
  on('btn-rescan', 'click', () => { state.lookup = null; render(); openScanner(); });

  document.querySelectorAll('[data-dup]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = el.dataset.dup;
      const rec = state.records.find(r => r.id === id);
      if (rec) {
        state.lookup = null;
        state.detail = rec;
        render();
      }
    });
  });

  // Detail actions
  on('btn-edit', 'click', () => {
    state.editing = { ...state.detail };
    state.detail = null;
    render();
  });
  on('btn-delete', 'click', () => {
    if (confirm('Remove this record from your collection?')) {
      state.records = state.records.filter(r => r.id !== state.detail.id);
      saveRecords();
      state.detail = null;
      render();
      toast('Record removed');
    }
  });

  // Settings
  const dt = document.getElementById('discogs-token');
  if (dt) dt.addEventListener('change', () => { state.settings.discogsToken = dt.value; saveSettings(); toast('Token saved'); });

  on('btn-export-json', 'click', exportJSON);
  on('btn-export-csv', 'click', exportCSV);
  on('btn-export-discogs', 'click', exportDiscogsCSV);
  on('btn-import-json', 'click', () => document.getElementById('file-import')?.click());
  const fi = document.getElementById('file-import');
  if (fi) fi.addEventListener('change', importJSON);

  // Start camera if scanner is open
  if (state.scanning && !isManualMode) startCamera();
}

function on(id, evt, fn) {
  const el = document.getElementById(id);
  if (el) el.addEventListener(evt, fn);
}

function closeModals() {
  state.lookup = null;
  state.detail = null;
  state.editing = null;
  state.collectionModal = null;
  render();
}

// ============================================================================
// SCANNER LOGIC
// ============================================================================
function openScanner() {
  state.scanning = true;
  isManualMode = false;
  render();
}

function closeScanner() {
  stopCamera();
  state.scanning = false;
  isManualMode = false;
  render();
}

function toggleScannerMode() {
  isManualMode = !isManualMode;
  const cam = document.getElementById('scanner-camera-area');
  const man = document.getElementById('scanner-manual-area');
  const btn = document.getElementById('scanner-toggle-manual');
  if (isManualMode) {
    stopCamera();
    if (cam) cam.style.display = 'none';
    if (man) man.style.display = 'block';
    if (btn) btn.textContent = 'Camera';
    document.getElementById('manual-barcode')?.focus();
  } else {
    if (cam) cam.style.display = 'block';
    if (man) man.style.display = 'none';
    if (btn) btn.textContent = 'Manual';
    startCamera();
  }
}

async function startCamera() {
  const video = document.getElementById('scanner-video');
  if (!video) return;

  try {
    scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = scannerStream;
    await video.play();

    const codeReader = new ZXing.BrowserMultiFormatReader();
    codeReader.decodeFromStream(scannerStream, video, (result, err) => {
      if (result) {
        const code = result.getText();
        stopCamera();
        closeScanner();
        doLookup(code);
      }
    });
    // Store reader reference so we can stop it
    scannerInterval = codeReader;

  } catch(e) {
    // Camera error, switch to manual
    toggleScannerMode();
  }
}

function stopCamera() {
  if (scannerInterval && typeof scannerInterval.reset === 'function') {
    scannerInterval.reset();
  }
  scannerInterval = null;
  if (scannerStream) { scannerStream.getTracks().forEach(t => t.stop()); scannerStream = null; }
}

// ============================================================================
// LOOKUP & SAVE
// ============================================================================
async function doLookup(barcode) {
  state.lookup = { loading: true, barcode };
  render();

  try {
    const result = await lookupBarcode(barcode);
    if (!result) {
      state.lookup = { loading: false, barcode, error: 'No release found for this barcode.', result: { barcode, vinylCondition:'NM', sleeveCondition:'NM', media_condition:'NM', sleeve_condition:'NM', confidence:'low' } };
    } else {
      result.vinylCondition = result.vinylCondition || 'NM';
      result.sleeveCondition = result.sleeveCondition || 'NM';
      result.media_condition = result.media_condition || result.vinylCondition;
      result.sleeve_condition = result.sleeve_condition || result.sleeveCondition;
      result.confidence = result.discogsId ? 'high' : (barcode ? 'medium' : 'low');
      const dup = findDuplicate(barcode, result.discogsId);
      state.lookup = { loading: false, barcode, result, duplicate: dup || null };
    }
  } catch(e) {
    state.lookup = { loading: false, barcode, error: e.message, result: { barcode, vinylCondition:'NM', sleeveCondition:'NM', media_condition:'NM', sleeve_condition:'NM', confidence:'low' } };
  }
  render();
}

function findDuplicate(barcode, discogsId) {
  return state.records.find(r => {
    if (r.wishlist) return false;
    if (barcode && r.barcode && String(r.barcode) === String(barcode)) return true;
    if (discogsId && r.discogsId && String(r.discogsId) === String(discogsId)) return true;
    return false;
  });
}

function saveForm() {
  const isEdit = !!state.editing;
  const base = isEdit ? state.editing : (state.lookup?.result || {});

  const data = { ...base };
  const fa = document.getElementById('form-artist');
  const ft = document.getElementById('form-title');
  if (fa) data.artist = fa.value;
  if (ft) data.title = ft.value;
  const mc = document.getElementById('form-vinyl-cond')?.value || 'NM';
  const sc = document.getElementById('form-sleeve-cond')?.value || 'NM';
  data.media_condition = mc;
  data.sleeve_condition = sc;
  data.vinylCondition = mc;
  data.sleeveCondition = sc;
  const pp = document.getElementById('form-price')?.value;
  data.purchasePrice = pp ? parseFloat(pp) : null;
  data.purchaseDate = document.getElementById('form-date')?.value || '';
  data.purchase_source = document.getElementById('form-source')?.value || '';
  data.location = document.getElementById('form-location')?.value || '';
  data.pressing_notes = document.getElementById('form-pressing')?.value || '';
  const tagsRaw = document.getElementById('form-tags')?.value || '';
  data.tags = tagsRaw.split(',').map(t => t.trim()).filter(Boolean);
  data.notes = document.getElementById('form-notes')?.value || '';
  data.for_sale = document.getElementById('form-for-sale')?.checked || false;
  data.wishlist = document.getElementById('form-wishlist')?.checked || false;
  data.updated_at = new Date().toISOString();
  data.schema_version = SCHEMA_VERSION;

  if (isEdit && data.id) {
    state.records = state.records.map(r => r.id === data.id ? { ...r, ...data } : r);
    toast('Record updated');
  } else {
    data.id = uid();
    data.dateAdded = new Date().toISOString();
    if (!data.confidence) data.confidence = data.discogsId ? 'high' : (data.barcode ? 'medium' : 'low');
    state.records.unshift(data);
    toast('Added to collection');
  }

  saveRecords();
  state.lookup = null;
  state.editing = null;
  render();
}

// ============================================================================
// EXPORT / IMPORT
// ============================================================================
function exportJSON() {
  const blob = new Blob([JSON.stringify({ records: state.records, settings: state.settings, exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' });
  dl(blob, `vinyl-radar-${new Date().toISOString().split('T')[0]}.json`);
  toast('Backup downloaded');
}

function exportCSV() {
  const h = ['Artist','Title','Year','Label','Catalog#','Barcode','Genre','Media','Sleeve','Paid','Purchase Date','Source','Location','Tags','Pressing Notes','For Sale','Estimated Value','Notes','Wishlist'];
  const rows = state.records.map(r => {
    const v = calcValue(r);
    const mc = r.media_condition || r.vinylCondition;
    const sc = r.sleeve_condition || r.sleeveCondition;
    const tags = Array.isArray(r.tags) ? r.tags.join('; ') : '';
    return [r.artist,r.title,r.year,r.label,r.catalogNumber,r.barcode,r.genre,mc,sc,r.purchasePrice,r.purchaseDate,r.purchase_source,r.location,tags,r.pressing_notes,r.for_sale?'Yes':'',v?.estimate||'',r.notes,r.wishlist?'Yes':''].map(v => `"${(v??'').toString().replace(/"/g,'""')}"`).join(',');
  });
  const csv = [h.join(','), ...rows].join('\n');
  dl(new Blob([csv], { type:'text/csv' }), `vinyl-radar-${new Date().toISOString().split('T')[0]}.csv`);
  toast('CSV exported');
}

function exportDiscogsCSV() {
  const h = ['Catalog#','Artist','Title','Label','Format','Rating','Released','release_id','CollectionFolder','Date Added','Collection Media Condition','Collection Sleeve Condition','Collection Notes'];
  const own = state.records.filter(r => !r.wishlist);
  const rows = own.map(r => {
    const mc = r.media_condition || r.vinylCondition || '';
    const sc = r.sleeve_condition || r.sleeveCondition || '';
    const notesParts = [];
    if (r.notes) notesParts.push(r.notes);
    if (r.pressing_notes) notesParts.push('Pressing: ' + r.pressing_notes);
    if (r.purchase_source) notesParts.push('Source: ' + r.purchase_source);
    if (r.location) notesParts.push('Location: ' + r.location);
    if (Array.isArray(r.tags) && r.tags.length) notesParts.push('Tags: ' + r.tags.join(', '));
    if (r.purchasePrice) notesParts.push('Paid: ' + r.purchasePrice + (r.purchaseDate ? ' on ' + r.purchaseDate : ''));
    const notes = notesParts.join(' | ');
    const dateAdded = r.dateAdded ? r.dateAdded.split('T')[0] : '';
    return [r.catalogNumber||'', r.artist||'', r.title||'', r.label||'', 'Vinyl', '', r.year||'', r.discogsId||'', 'Uncategorized', dateAdded, mc, sc, notes]
      .map(v => `"${String(v).replace(/"/g,'""')}"`).join(',');
  });
  const csv = [h.join(','), ...rows].join('\n');
  dl(new Blob([csv], { type:'text/csv' }), `vinyl-radar-for-discogs-${new Date().toISOString().split('T')[0]}.csv`);
  toast('Discogs CSV exported');
}

function importJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (Array.isArray(d.records)) {
        state.records = d.records;
        saveRecords();
        if (d.settings) { Object.assign(state.settings, d.settings); saveSettings(); }
        toast(`Restored ${d.records.length} records`);
        render();
      } else { toast('Invalid backup file', 'error'); }
    } catch(er) { toast('Could not read file', 'error'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function dl(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ============================================================================
// SERVICE WORKER REGISTRATION
// ============================================================================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'activated' && navigator.serviceWorker.controller) {
            toast('App updated — refresh for the latest version');
          }
        });
      });
    }).catch(err => console.log('SW registration failed:', err));
  });
}

// ============================================================================
// INIT
// ============================================================================
loadState();
render();
</script>
